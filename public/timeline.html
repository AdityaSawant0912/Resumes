<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Timeline</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 48px auto;
    padding: 0 20px;
    color: #1a1a1a;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: #888; margin-top: 0; font-size: 14px; }
  .empty, .error { color: #888; font-size: 14px; }

  .timeline { margin-top: 32px; }

  .row {
    display: grid;
    grid-template-columns: 1fr 20px 1fr;
    cursor: pointer;
    border-radius: 6px;
  }
  .row:hover { background: #fafafa; }
  .row:hover .dot { background: #1a1a1a; }

  .date {
    text-align: right;
    padding: 2px 16px 24px 0;
    font-size: 13px;
    color: #888;
    white-space: nowrap;
  }

  .line-col {
    position: relative;
    display: flex;
    justify-content: center;
  }
  .line-col::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #e5e5e5;
  }
  .row:last-child .line-col::before { bottom: auto; height: 12px; }
  .dot {
    position: relative;
    top: 4px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #bbb;
    border: 2px solid #fff;
  }

  .msg {
    padding: 0 0 24px 16px;
    font-size: 14px;
    line-height: 1.4;
  }
  .msg-line { color: #1a1a1a; }
  .msg-extra { list-style: none; margin: 6px 0 0; padding: 0; color: #555; }
  .msg-extra li { padding: 2px 0; }
  .toggle {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: #06c;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .toggle:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>Resume Timeline</h1>
  <p class="sub">Every pushed version of the resume, newest first. Click a point to view it.</p>
  <div id="root"><p class="empty">Loading...</p></div>

  <script>
    fetch('/timeline/index.json')
      .then(function (r) { return r.json(); })
      .then(function (entries) {
        var root = document.getElementById('root');
        if (!entries.length) {
          root.innerHTML = '<p class="empty">No history yet.</p>';
          return;
        }

        var rows = entries.slice().reverse().map(function (entry) {
          var date = new Date(entry.date).toLocaleString(undefined, {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
          var messages = entry.messages || [];
          var first = messages[0] || '(no message)';
          var rest = messages.slice(1);

          var restHtml = '';
          if (rest.length) {
            var restItems = rest.map(function (m) { return '<li>' + escapeHtml(m) + '</li>'; }).join('');
            restHtml =
              '<button class="toggle" type="button">+' + rest.length + ' more</button>' +
              '<ul class="msg-extra" hidden>' + restItems + '</ul>';
          }

          return (
            '<div class="row" data-id="' + entry.id + '">' +
              '<div class="date">' + date + '</div>' +
              '<div class="line-col"><span class="dot"></span></div>' +
              '<div class="msg">' +
                '<div class="msg-line">' + escapeHtml(first) + '</div>' +
                restHtml +
              '</div>' +
            '</div>'
          );
        }).join('');

        root.innerHTML = '<div class="timeline">' + rows + '</div>';

        root.querySelectorAll('.row').forEach(function (row) {
          row.addEventListener('click', function () {
            window.location.href = '/api/render?id=' + row.dataset.id;
          });
        });

        root.querySelectorAll('.toggle').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var extra = btn.nextElementSibling;
            var expanded = !extra.hidden;
            extra.hidden = expanded;
            btn.textContent = expanded
              ? '+' + extra.children.length + ' more'
              : 'show less';
          });
        });
      })
      .catch(function (err) {
        document.getElementById('root').innerHTML = '<p class="error">Could not load timeline: ' + escapeHtml(err.message) + '</p>';
      });

    function escapeHtml(s) {
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
  </script>
</body>
</html>
